---
- name: Validate Docker host platform
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
      - ansible_facts['architecture'] in ["aarch64", "x86_64"]
    fail_msg: "The VPS Docker role supports Ubuntu on arm64 or amd64."

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configure Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch={{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    owner: root
    group: root
    mode: "0644"

- name: Install Docker Engine, Buildx, and Compose
  ansible.builtin.apt:
    name: "{{ docker_engine_packages }}"
    state: present
    update_cache: true
    lock_timeout: 300

- name: Add deployment user to Docker group
  ansible.builtin.user:
    name: "{{ docker_engine_user }}"
    groups: docker
    append: true

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Read Docker service state
  ansible.builtin.command: docker info --format '{{ "{{" }}json .ServerVersion{{ "}}" }}'
  register: docker_engine_info
  changed_when: false
  check_mode: false

- name: Report Docker service state
  ansible.builtin.debug:
    msg: "Docker Engine {{ docker_engine_info.stdout }} is ready."
