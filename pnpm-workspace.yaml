packages:
  - src/cli
  - src/openclaw-voice
  - src/orchestrator
  - src/orchestrator/web

# Peers are not installed automatically: the OpenClaw plugin's `openclaw` peer
# is the host gateway itself, never a dependency to fetch.
autoInstallPeers: false

allowBuilds:
  '@google/genai': false
  '@mongodb-js/zstd': false
  esbuild: true
  koffi: false
  onnxruntime-node: false
  node-liblzma: false
  protobufjs: false
  sharp: true
