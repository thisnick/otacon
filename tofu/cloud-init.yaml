#cloud-config
#
# First-boot setup for the otacon-orchestrator VPS.
# Provisions Docker + Tailscale, writes the compose stack to
# /opt/orchestrator, runs `docker compose up -d`, exposes the
# orchestrator HTTP server (port 9090) at https://otacon-orchestrator.
# <tailnet_domain>/ via `tailscale serve`.
#
# Topology: ONE Tailscale node per VM. The host's `tailscale up`
# handles both:
#   - admin SSH (`ssh ubuntu@otacon-orchestrator.<tailnet_domain>`)
#   - HTTPS Serve (`tailscale serve --https=443 http://127.0.0.1:9090`)
# No tailscale sidecar — the orchestrator container runs in
# `network_mode: host` so it shares the VM's netns directly. That gives
# it Tailscale DNS + routing (needed to reach the registry and phone
# hosts) and binds 9090 on the host where Tailscale Serve already
# proxies it to :443 on the tailnet. This avoids the duplicate-
# hostname problem (host + sidecar both claiming
# `otacon-orchestrator` → second auto-suffixed `-1`) AND the
# bridge-network DNS gap that breaks tailnet egress from the
# container.
#
# Variables come from `templatefile()` in main.tf:
#   ${hostname}            — VM + Tailscale node name (otacon-orchestrator)
#   ${tailscale_auth_key}  — Tailscale pre-auth key
#   ${tailnet_domain}      — e.g. tail0437b8.ts.net
#   ${ghcr_pull_user}      — GHCR username for `docker login`
#   ${ghcr_pull_token}     — GHCR token (read:packages)
#   ${otacon_repo}         — image repo slug (otacon-dev | otacon)
#   ${otacon_token}        — bearer for calling the otacon registry
#   ${ai_gateway_api_key}  — Vercel AI Gateway key

hostname: ${hostname}
manage_etc_hosts: true

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - jq

write_files:
  - path: /opt/orchestrator/.env
    permissions: "0600"
    owner: root:root
    content: |
      ORCHESTRATOR_DATA_DIR=/data/orchestrator
      PORT=9090
      OTACON_TOKEN=${otacon_token}
      AI_GATEWAY_API_KEY=${ai_gateway_api_key}
      OTACON_REPO=${otacon_repo}
      OTACON_REGISTRY_URL=http://otacon-registry.${tailnet_domain}:9080

  - path: /opt/orchestrator/docker-compose.yml
    permissions: "0644"
    owner: root:root
    content: |
      services:
        otacon-orchestrator:
          image: ghcr.io/thisnick/$${OTACON_REPO:-otacon-dev}/orchestrator:latest
          # Pin the container name so Watchtower's filter
          # (`--include-restarting otacon-orchestrator`) matches
          # reliably, independent of compose's default
          # `<dir>-<service>-<n>` naming.
          container_name: otacon-orchestrator
          restart: unless-stopped
          # Host networking: container shares the host netns so it
          # inherits Tailscale DNS + routing (required to reach
          # otacon-registry.${tailnet_domain} and 100.x phone hosts
          # over the tailnet). Bridge networking has no Tailscale
          # visibility. Public ingress remains blocked by the OCI
          # security list (only UDP 41641 for Tailscale is open). The
          # host's `tailscale serve` still proxies 443 →
          # 127.0.0.1:9090. `ports:` is omitted — host networking
          # ignores port mappings.
          network_mode: host
          environment:
            - ORCHESTRATOR_DATA_DIR=$${ORCHESTRATOR_DATA_DIR:-/data/orchestrator}
            - PORT=$${PORT:-9090}
            - OTACON_REGISTRY_URL=$${OTACON_REGISTRY_URL:-http://otacon-registry.${tailnet_domain}:9080}
            - OTACON_TOKEN=$${OTACON_TOKEN}
            - AI_GATEWAY_API_KEY=$${AI_GATEWAY_API_KEY}
          volumes:
            - orchestrator-data:/data/orchestrator

        # Watchtower — auto-pulls the orchestrator image when a newer
        # tag lands in ghcr.io. Same pattern as the registry's
        # docker-compose. DOCKER_API_VERSION pin avoids the 1.25-
        # default-too-old restart-loop.
        watchtower:
          image: containrrr/watchtower:latest
          restart: unless-stopped
          environment:
            - DOCKER_API_VERSION=1.40
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /root/.docker/config.json:/config.json:ro
          command: --interval 60 --cleanup --include-restarting otacon-orchestrator

      volumes:
        orchestrator-data:

runcmd:
  # ── Tailscale ─────────────────────────────────────────────
  # Single host-level node. Handles both admin SSH AND HTTPS Serve for
  # the orchestrator container.
  - curl -fsSL https://tailscale.com/install.sh | sh
  - tailscale up --ssh --hostname=${hostname} --authkey=${tailscale_auth_key}
  # Expose the orchestrator container at https://${hostname}.${tailnet_domain}/
  # (Tailscale Serve issues a Let's Encrypt cert against the magic-DNS
  # name automatically). Backgrounded so subsequent runcmd steps
  # aren't blocked.
  - tailscale serve --bg --https=443 http://127.0.0.1:9090

  # ── Docker ────────────────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  # ── ghcr.io login (so Watchtower + initial pull can access private images) ──
  - echo "${ghcr_pull_token}" | docker login ghcr.io -u "${ghcr_pull_user}" --password-stdin

  # ── Stack ──────────────────────────────────────────────────
  - cd /opt/orchestrator && docker compose pull
  - cd /opt/orchestrator && docker compose up -d
