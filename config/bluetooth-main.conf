[General]
# BlueZ 5.58+: SCO audio is automatically routed through HCI when BlueALSA
# registers the HFP profile — SCORouting=HCI is no longer needed or recognized.
Name = Otacon

# Defense in depth: adapters are non-discoverable and non-pairable by default.
# The pair flow in fleet_agent/bluetooth/pair.py temporarily enables both on
# the specific adapter being paired, then disables them afterward.
# The BlueZ agent (fleet_agent/bluetooth/agent.py) enforces per-adapter MAC
# allowlists as an additional layer — even if Pairable were true, only the
# assigned phone can pair with each adapter.
Discoverable = false
DiscoverableTimeout = 60
AlwaysPairable = false
JustWorksRepairing = never
