[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:hostapd]
command=bash -c 'sleep 2 && [ -f /etc/hostapd/hostapd.conf ] && exec hostapd /etc/hostapd/hostapd.conf || echo "hostapd: no config, skipping" && sleep infinity'
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dnsmasq]
command=bash -c 'sleep 2 && [ -f /etc/dnsmasq-ap.conf ] && exec dnsmasq --no-daemon --conf-file=/etc/dnsmasq-ap.conf || echo "dnsmasq: no config, skipping" && sleep infinity'
autorestart=true
priority=26
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wifi-monitor]
command=bash -u /opt/wifi-monitor.sh
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:device-monitor]
command=python3 -u /opt/device-monitor.py
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:audio-server]
command=/usr/local/bin/otacon-server
autorestart=true
startsecs=3
startretries=999
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
