
[program:dbus]
command=bash -c 'rm -f /run/dbus/pid /run/dbus/system_bus_socket && dbus-daemon --system --nofork'
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bluetoothd]
command=bluetoothd -n -E --noplugin=sap
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bluealsa]
; HFP HF mode: Pi acts as a Bluetooth headset (hands-free unit).
; The phone connects as AG and routes mic audio over SCO to BlueALSA.
; Sleep 3s so bluetoothd is ready to register the HFP HF profile.
; Enumerate all HCI adapters and pass --hci for each so BlueALSA registers
; A2DP/HFP profiles on every dongle, not just the default (hci0).
; Without this, adapters other than hci0 get AVDTP "Function not implemented".
command=bash -c 'sleep 3 && HCI_ARGS=$(hciconfig -a 2>/dev/null | grep -oP "^hci\d+" | sort -u | sed "s/^/--hci=/" | tr "\n" " "); exec bluealsa $HCI_ARGS --profile=hfp-hf --profile=a2dp-sink'
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; bt-agent and bt-reconnect are now integrated into fleet-agent
; (fleet_agent/bluetooth/agent.py and fleet_agent/bluetooth/reconnect.py)
