# Local + VPS deploy target for the orchestrator image. Cloud-init
# writes a near-identical compose to /opt/orchestrator/docker-compose.yml
# on the VM (see tofu/cloud-init.yaml); changes here should be mirrored
# there.
#
# Topology: the orchestrator runs in `network_mode: host` so it inherits
# the VM's Tailscale interface — required to reach
# `otacon-registry.tail0437b8.ts.net` (and `otacon-pi.tail0437b8.ts.net`)
# over the tailnet. Bridge networking would lose Tailscale DNS + routing.
# The container binds 0.0.0.0:9090 directly on the host; Tailscale Serve
# on the host proxies 443 → 127.0.0.1:9090. OCI security list still
# blocks 9090 publicly so external exposure is unchanged. NO Tailscale
# sidecar — one Tailscale node per VM, one hostname (otacon-
# orchestrator), no `-1` auto-suffix from a duplicate registration.
#
# Image is built + pushed to ghcr.io by `make orchestrator-build`
# (uses `docker buildx --push --platform linux/arm64`). Watchtower on
# the VPS picks it up within ~60s. NO `build:` block here — local
# `docker compose build` would only produce a host-arch image, which
# wouldn't run on the ARM Ampere VPS.
#
# Boot locally for smoke: `docker compose -f docker-compose.orchestrator.yml up -d`
# runs the container with the laptop's network stack. For pure local
# dev (no Docker), use `pnpm dev` from the repo root — boots the
# server (tsx --watch) + Vite UI (HMR on :5173) concurrently.
services:
  otacon-orchestrator:
    image: ghcr.io/thisnick/${OTACON_REPO:-otacon-dev}/orchestrator:latest
    # Pin the container name so Watchtower's filter
    # (`--include-restarting otacon-orchestrator`) matches reliably,
    # independent of compose's default `<dir>-<service>-<n>` naming.
    container_name: otacon-orchestrator
    restart: unless-stopped
    # Host networking: container shares host netns. Tailscale DNS +
    # routing become available; the container can resolve
    # `otacon-registry.tail0437b8.ts.net` and reach 100.x CGNAT phone
    # hosts. Public ingress is still blocked by the OCI security list.
    # `ports:` is intentionally omitted — host networking ignores port
    # mappings. The orchestrator binds PORT=9090 directly on host.
    network_mode: host
    environment:
      - ORCHESTRATOR_DATA_DIR=${ORCHESTRATOR_DATA_DIR:-/data/orchestrator}
      - PORT=${PORT:-9090}
      - OTACON_REGISTRY_URL=${OTACON_REGISTRY_URL:-}
      - OTACON_TOKEN=${OTACON_TOKEN:-}
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY:-}
    volumes:
      - orchestrator-data:/data/orchestrator

  # Watchtower — auto-pulls the orchestrator image when a newer tag
  # lands in ghcr.io. 60s polling is fine for the dev iteration tempo;
  # production deploys can extend with --schedule.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      # Pin the Docker API version Watchtower uses. Without this, the
      # default 1.25 client mismatches the modern Docker daemon
      # (minimum supported = 1.40), restart-looping the container.
      # Same value the registry compose uses.
      - DOCKER_API_VERSION=1.40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup --include-restarting otacon-orchestrator

volumes:
  orchestrator-data:
