<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otacon Orchestrator — Runs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; padding: 16px; font-size: 13px; }
h1 { font-size: 18px; margin-bottom: 4px; }
.header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.header .stats { color: #8b949e; font-size: 13px; }
.header a { color: #58a6ff; text-decoration: none; margin-left: auto; font-size: 12px; }
.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.filters label { color: #8b949e; font-size: 11px; text-transform: uppercase; }
.filters input, .filters select { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 12px; }
.filters input:focus, .filters select:focus { outline: none; border-color: #58a6ff; }
.filters button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
.filters button:hover { background: #30363d; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #21262d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
th { color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase; }
tr:hover { background: #161b22; cursor: pointer; }
.s-running { color: #d2a8ff; }
.s-completed { color: #3fb950; }
.s-failed { color: #f85149; }
.s-cancelled { color: #d29922; }
.s-created { color: #8b949e; }
.id-cell { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #58a6ff; font-size: 12px; }
.empty { color: #484f58; padding: 24px; text-align: center; }
.prompt-cell { color: #8b949e; max-width: 400px; }
.error { color: #f85149; padding: 12px; background: #25171c; border: 1px solid #5d2a3a; border-radius: 4px; margin-top: 12px; }
.btn-primary { background: #1a4d2e; color: #d6f0db; border: 1px solid #2a6d4a; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; }
.btn-primary:hover { background: #235e3a; }
.btn-primary:disabled { opacity: 0.6; cursor: wait; }
.btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; }
.btn-secondary:hover { background: #30363d; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 24px; }
.modal.open { display: flex; }
.modal .panel { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 18px; min-width: 480px; max-width: 720px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 14px; color: #58a6ff; margin-bottom: 12px; }
.modal .row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.modal label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
.modal select, .modal textarea, .modal input[type=text] { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 10px; border-radius: 4px; font-family: inherit; font-size: 13px; }
.modal textarea { resize: vertical; min-height: 80px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.modal .helper { font-size: 11px; color: #8b949e; }
.modal .form-error { color: #f85149; padding: 8px 10px; background: #25171c; border: 1px solid #5d2a3a; border-radius: 4px; font-size: 12px; margin-top: 8px; }
.modal .form-error pre { margin-top: 6px; max-height: 200px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: pre-wrap; }
.modal .form-error summary { cursor: pointer; }
</style>
</head>
<body data-testid="otacon-orchestrator-runs">

<div class="header">
  <h1>Otacon Orchestrator</h1>
  <span class="stats" id="stats">loading…</span>
  <button class="btn-primary" id="btn-new-run" data-testid="btn-new-run" style="margin-left:auto">+ New run</button>
  <a href="/health" target="_blank" style="margin-left:8px">/health</a>
</div>

<div class="modal" id="new-run-modal" data-testid="new-run-modal">
  <div class="panel">
    <h2>Start a new run</h2>
    <div class="row">
      <label for="nr-account">Account</label>
      <select id="nr-account" data-testid="nr-account"><option value="">loading…</option></select>
      <span class="helper" id="nr-account-helper"></span>
    </div>
    <div class="row">
      <label for="nr-team">Team</label>
      <select id="nr-team" data-testid="nr-team"><option value="">loading…</option></select>
      <span class="helper" id="nr-team-helper"></span>
    </div>
    <div class="row">
      <label for="nr-prompt">Initial prompt (optional)</label>
      <textarea id="nr-prompt" data-testid="nr-prompt" placeholder="Open the Xiaohongshu app and scroll the home feed once."></textarea>
    </div>
    <div id="nr-error"></div>
    <div class="actions">
      <button class="btn-secondary" id="nr-cancel" type="button">Cancel</button>
      <button class="btn-primary" id="nr-submit" type="button" data-testid="nr-submit">Start run</button>
    </div>
  </div>
</div>

<div class="filters">
  <label>Account</label>
  <input id="f-account" type="text" placeholder="xhs:test" />
  <label>Team</label>
  <input id="f-team" type="text" placeholder="social-media-engagement" />
  <label>Status</label>
  <select id="f-status">
    <option value="">(any)</option>
    <option value="created">created</option>
    <option value="running">running</option>
    <option value="completed">completed</option>
    <option value="failed">failed</option>
    <option value="cancelled">cancelled</option>
  </select>
  <label>Limit</label>
  <input id="f-limit" type="number" value="50" min="1" max="500" style="width:64px" />
  <button id="f-apply">Apply</button>
  <button id="f-clear">Clear</button>
</div>

<table>
  <thead>
    <tr>
      <th>Run ID</th>
      <th>Account</th>
      <th>Team</th>
      <th>Status</th>
      <th>Started</th>
      <th>Duration</th>
      <th>Initial Prompt</th>
    </tr>
  </thead>
  <tbody id="runs-body"></tbody>
</table>

<div id="error-box"></div>

<script>
'use strict';

const $ = (id) => document.getElementById(id);

function fmtTimestamp(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  // Local-time YYYY-MM-DD HH:mm:ss
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function fmtDuration(startMs, endMs) {
  if (!startMs) return '';
  const end = endMs ?? Date.now();
  const ms = end - startMs;
  if (ms < 1000) return `${ms}ms`;
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const rs = s - m * 60;
  if (m < 60) return `${m}m ${rs}s`;
  const h = Math.floor(m / 60);
  const rm = m - h * 60;
  return `${h}h ${rm}m`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function buildQuery(params) {
  const usp = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== '' && v !== null) usp.set(k, String(v));
  }
  const qs = usp.toString();
  return qs ? `?${qs}` : '';
}

async function loadRuns() {
  const account = $('f-account').value.trim();
  const team = $('f-team').value.trim();
  const status = $('f-status').value;
  const limit = $('f-limit').value || '50';

  // Persist filter state in URL for bookmarking + reloads.
  const url = new URL(window.location.href);
  url.search = buildQuery({ account, team, status, limit });
  history.replaceState({}, '', url.toString());

  try {
    const res = await fetch(`/api/v1/runs${buildQuery({ account, team, status, limit })}`);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status} ${res.statusText}`);
    }
    const body = await res.json();
    renderRuns(body.runs || []);
    $('error-box').innerHTML = '';
  } catch (err) {
    $('error-box').innerHTML = `<div class="error">Error loading runs: ${escapeHtml(err.message)}</div>`;
    $('runs-body').innerHTML = '';
    $('stats').textContent = 'error';
  }
}

function renderRuns(runs) {
  const tbody = $('runs-body');
  if (runs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">no runs match the current filters</td></tr>';
    $('stats').textContent = '0 runs';
    return;
  }
  $('stats').textContent = `${runs.length} run${runs.length === 1 ? '' : 's'}`;
  tbody.innerHTML = runs.map((r) => {
    const promptShort = r.initialPrompt ? r.initialPrompt.slice(0, 80) : '';
    return `
      <tr data-run-id="${escapeHtml(r.id)}" onclick="window.location.href='/run.html?id=${encodeURIComponent(r.id)}'">
        <td class="id-cell">${escapeHtml(r.id)}</td>
        <td>${escapeHtml(r.account || '')}</td>
        <td>${escapeHtml(r.team || '')}</td>
        <td class="s-${escapeHtml(r.status || 'created')}">${escapeHtml(r.status || 'created')}</td>
        <td>${escapeHtml(fmtTimestamp(r.startedAt))}</td>
        <td>${escapeHtml(fmtDuration(r.startedAt, r.completedAt))}</td>
        <td class="prompt-cell">${escapeHtml(promptShort)}</td>
      </tr>
    `;
  }).join('');
}

function applyUrlFiltersToInputs() {
  const usp = new URLSearchParams(window.location.search);
  if (usp.has('account')) $('f-account').value = usp.get('account');
  if (usp.has('team')) $('f-team').value = usp.get('team');
  if (usp.has('status')) $('f-status').value = usp.get('status');
  if (usp.has('limit')) $('f-limit').value = usp.get('limit');
}

$('f-apply').onclick = loadRuns;
$('f-clear').onclick = () => {
  $('f-account').value = '';
  $('f-team').value = '';
  $('f-status').value = '';
  $('f-limit').value = '50';
  loadRuns();
};
$('f-account').addEventListener('keyup', (e) => { if (e.key === 'Enter') loadRuns(); });
$('f-team').addEventListener('keyup', (e) => { if (e.key === 'Enter') loadRuns(); });
$('f-status').addEventListener('change', loadRuns);

applyUrlFiltersToInputs();
loadRuns();

// ─────────── New-run modal ───────────────────────────────────
//
// Lazy-loads the account + team dropdowns when the modal opens so the
// initial runs-list page-load doesn't pay for two extra API calls when
// the user never opens the form. Each dropdown failure surfaces an
// inline retry button rather than blocking submit (the user might still
// type a known account/team — but we don't expose that fallback path
// in the UI; submit is disabled when either dropdown is empty).

let nrAccountsLoaded = false;
let nrTeamsLoaded = false;

async function loadAccountsForModal() {
  const sel = $('nr-account');
  const helper = $('nr-account-helper');
  helper.textContent = '';
  sel.disabled = true;
  sel.innerHTML = '<option value="">loading…</option>';
  try {
    const res = await fetch('/api/v1/accounts');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const body = await res.json();
    const accounts = Array.isArray(body.accounts) ? body.accounts : [];
    if (accounts.length === 0) {
      sel.innerHTML = '<option value="">(no accounts)</option>';
      helper.innerHTML = `No accounts yet. <a href="#" id="nr-account-retry">Retry</a> · or run <code>pnpm orchestrator service add-account --id ...</code>`;
      $('nr-account-retry').onclick = (e) => { e.preventDefault(); loadAccountsForModal(); };
      sel.disabled = true;
      nrAccountsLoaded = false;
      return;
    }
    sel.innerHTML = accounts.map(a => `<option value="${escapeHtml(a.id)}">${escapeHtml(a.id)}${a.displayName ? ' (' + escapeHtml(a.displayName) + ')' : ''}</option>`).join('');
    sel.disabled = false;
    nrAccountsLoaded = true;
    // Default to the same account the runs-list filter is set to (if any).
    const filterAccount = $('f-account').value.trim();
    if (filterAccount && accounts.some(a => a.id === filterAccount)) {
      sel.value = filterAccount;
    }
  } catch (err) {
    sel.innerHTML = '<option value="">load failed</option>';
    helper.innerHTML = `Error: ${escapeHtml(err.message)}. <a href="#" id="nr-account-retry">Retry</a>`;
    $('nr-account-retry').onclick = (e) => { e.preventDefault(); loadAccountsForModal(); };
    nrAccountsLoaded = false;
  }
}

async function loadTeamsForModal() {
  const sel = $('nr-team');
  const helper = $('nr-team-helper');
  helper.textContent = '';
  sel.disabled = true;
  sel.innerHTML = '<option value="">loading…</option>';
  try {
    const res = await fetch('/api/v1/teams');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const body = await res.json();
    const teams = Array.isArray(body.teams) ? body.teams : [];
    if (teams.length === 0) {
      sel.innerHTML = '<option value="">(no teams)</option>';
      helper.innerHTML = `No teams seeded. <a href="#" id="nr-team-retry">Retry</a> · or run <code>pnpm orchestrator service seed-team --name ...</code>`;
      $('nr-team-retry').onclick = (e) => { e.preventDefault(); loadTeamsForModal(); };
      sel.disabled = true;
      nrTeamsLoaded = false;
      return;
    }
    sel.innerHTML = teams.map(t => `<option value="${escapeHtml(t.name)}">${escapeHtml(t.name)}${t.lead ? ' · lead=' + escapeHtml(t.lead) : ''}</option>`).join('');
    sel.disabled = false;
    nrTeamsLoaded = true;
    // Default to social-media-engagement (matches runs.post.ts default).
    if (teams.some(t => t.name === 'social-media-engagement')) {
      sel.value = 'social-media-engagement';
    }
  } catch (err) {
    sel.innerHTML = '<option value="">load failed</option>';
    helper.innerHTML = `Error: ${escapeHtml(err.message)}. <a href="#" id="nr-team-retry">Retry</a>`;
    $('nr-team-retry').onclick = (e) => { e.preventDefault(); loadTeamsForModal(); };
    nrTeamsLoaded = false;
  }
}

function openNewRunModal() {
  $('nr-error').innerHTML = '';
  $('nr-prompt').value = '';
  $('new-run-modal').classList.add('open');
  // Reload dropdowns every open so newly-created accounts/teams show up.
  loadAccountsForModal();
  loadTeamsForModal();
}

function closeNewRunModal() {
  $('new-run-modal').classList.remove('open');
}

async function submitNewRun() {
  const account = $('nr-account').value;
  const team = $('nr-team').value;
  const prompt = $('nr-prompt').value.trim();
  $('nr-error').innerHTML = '';
  if (!account) {
    $('nr-error').innerHTML = `<div class="form-error">Account is required.</div>`;
    return;
  }
  if (!team) {
    $('nr-error').innerHTML = `<div class="form-error">Team is required.</div>`;
    return;
  }
  const submit = $('nr-submit');
  submit.disabled = true;
  submit.textContent = 'Starting…';
  try {
    const res = await fetch('/api/v1/runs', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ account, team, prompt: prompt || undefined }),
    });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status} ${res.statusText}\n${text}`);
    }
    const body = await res.json();
    if (!body.runId) throw new Error('Response missing runId field');
    // Redirect to the live-tail page for the new run.
    window.location.href = `/run.html?id=${encodeURIComponent(body.runId)}`;
  } catch (err) {
    submit.disabled = false;
    submit.textContent = 'Start run';
    const msg = String(err.message || err);
    $('nr-error').innerHTML = `
      <div class="form-error">
        Run start failed.
        <details><summary>details</summary><pre>${escapeHtml(msg)}</pre></details>
      </div>`;
  }
}

$('btn-new-run').onclick = openNewRunModal;
$('nr-cancel').onclick = closeNewRunModal;
$('nr-submit').onclick = submitNewRun;
$('new-run-modal').addEventListener('click', (e) => {
  if (e.target.id === 'new-run-modal') closeNewRunModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('new-run-modal').classList.contains('open')) closeNewRunModal();
});
</script>
</body>
</html>
