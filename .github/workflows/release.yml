name: Release

# Versions share one number line (docs/releasing.md): a package moves only
# when it changes, and then to the next version of the whole group.
#
# Changes merged to main open (or update) a "Version Packages" PR, from
# their changesets plus a patch changeset for any image whose inputs changed
# without one (scripts/auto-changesets.mjs). Merging it bumps the versions;
# a push to main whose root version has no v<version> tag yet is released:
#   1. build: the images whose package version is new, pushed as
#      <image>:<version>, and the kiosk APK with the otacon image
#   2. publish: npm packages whose version is new (trusted publishing), the
#      v<version> tag and GitHub release, then :latest for the images just
#      built, which Watchtower on the hosts deploys. Unchanged images keep
#      :latest, so their containers don't restart.
# Every step is safe to re-run.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to compare images with their last release

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the changesets step, which leaves the version branch checked out.
      - name: Is this version released yet?
        id: check
        run: |
          node scripts/sync-versions.mjs --check
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Images to build
        id: images
        if: steps.check.outputs.release == 'true'
        run: echo "images=$(node scripts/release-images.mjs "ghcr.io/$GITHUB_REPOSITORY")" >> "$GITHUB_OUTPUT"

      - name: Changesets for images changed without one
        if: steps.check.outputs.release == 'false'
        run: node scripts/auto-changesets.mjs

      - name: Open or update the Version Packages PR
        if: steps.check.outputs.release == 'false'
        uses: changesets/action@v1
        with:
          title: Version Packages
          commit: "chore: version packages"
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    if: needs.version.outputs.release == 'true' && needs.version.outputs.images != '[]'
    uses: ./.github/workflows/build.yml
    with:
      images: ${{ needs.version.outputs.images }}
      push: true
    permissions:
      contents: read
      packages: write

  publish:
    needs: [version, build]
    # A release with no new image skips build; publish runs either way.
    if: always() && needs.version.outputs.release == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # npm trusted publishing + provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILT: ${{ needs.version.outputs.images }}
      IMAGES: ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Publish the npm packages
        run: pnpm run release

      - if: contains(needs.version.outputs.images, '"otacon"')
        uses: actions/download-artifact@v4
        with:
          name: kiosk-apk
          path: apk

      - name: Create the v${{ env.VERSION }} GitHub release
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          assets=()
          if [ -f apk/otacon-kiosk.apk ]; then
            cp apk/otacon-kiosk.apk "otacon-kiosk-$VERSION.apk"
            assets+=("otacon-kiosk-$VERSION.apk")
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            [ ${#assets[@]} -eq 0 ] || gh release upload "v$VERSION" "${assets[@]}" --clobber
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
              --notes-file notes.md "${assets[@]}"
          fi

      - if: needs.version.outputs.images != '[]'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Last, so the hosts only deploy a release that finished.
      - name: Point :latest at the images just built
        if: needs.version.outputs.images != '[]'
        run: |
          echo "$BUILT" | jq -r '.[] | "\(.image) \(.version)"' | while read -r image version; do
            docker buildx imagetools create -t "$IMAGES/$image:latest" "$IMAGES/$image:$version"
          done
