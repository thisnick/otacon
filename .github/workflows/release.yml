name: Release

# Everything in the repo shares one version (docs/releasing.md).
#
# Changes merged with changesets open (or update) a "Version Packages" PR.
# Merging it bumps the version; a push to main whose version has no
# v<version> tag yet is released:
#   1. build: every image (pushed as <image>:<version>) and the kiosk APK
#   2. publish: the npm packages (trusted publishing, no token), the
#      v<version> tag and GitHub release with the APK, then each image's
#      :latest moves to the new build, which Watchtower on the hosts deploys.
# Every step is safe to re-run.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the changesets step, which leaves the version branch checked out.
      - name: Is this version released yet?
        id: check
        run: |
          node scripts/sync-versions.mjs --check
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the Version Packages PR
        uses: changesets/action@v1
        with:
          title: Version Packages
          commit: "chore: version packages"
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      push: true
    permissions:
      contents: read
      packages: write

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # npm trusted publishing + provenance
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGES: ghcr.io/${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Publish the npm packages
        run: pnpm run release

      - uses: actions/download-artifact@v4
        with:
          name: kiosk-apk
          path: apk

      - name: Create the v${{ env.VERSION }} GitHub release
        run: |
          cp apk/otacon-kiosk.apk "otacon-kiosk-$VERSION.apk"
          node scripts/release-notes.mjs "$VERSION" > notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "otacon-kiosk-$VERSION.apk" --clobber
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
              --notes-file notes.md "otacon-kiosk-$VERSION.apk"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Last, so the hosts only deploy a release that finished.
      - name: Point each image's :latest at v${{ env.VERSION }}
        run: |
          for image in otacon voice registry orchestrator; do
            docker buildx imagetools create -t "$IMAGES/$image:latest" "$IMAGES/$image:$VERSION"
          done
