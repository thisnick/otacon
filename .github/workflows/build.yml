name: Build

# The ARM64 images (and, with the otacon image, the kiosk APK). release.yml
# calls this with the images a release builds, each pushed as
# <image>:<version>. Pull requests that touch a Dockerfile or this workflow
# build all of them without pushing. Run it by hand (Actions → Build) to
# check a branch; that doesn't push either unless asked, and then only
# <image>:sha-<commit>.
on:
  workflow_call:
    inputs:
      images:
        description: 'JSON: [{"image", "file", "version"}] (scripts/release-images.mjs)'
        type: string
        required: true
      push:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: Push the images as <image>:sha-<commit>
        type: boolean
        default: false
  pull_request:
    paths: ["Dockerfile.*", ".dockerignore", ".github/workflows/build.yml"]

permissions: {}

jobs:
  image:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images || '[{"image":"otacon","file":"Dockerfile.otacon"},{"image":"voice","file":"Dockerfile.voice"},{"image":"registry","file":"Dockerfile.registry"},{"image":"orchestrator","file":"Dockerfile.orchestrator"}]') }}
    env:
      TAG: ${{ matrix.version || format('sha-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4

      # The APK stage runs Android's aapt2, which is x86_64-only: an ARM
      # host runs it through binfmt (see Dockerfile.otacon).
      - if: matrix.image == 'otacon'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - uses: docker/setup-buildx-action@v3

      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: ${{ inputs.push == true }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Same build as the image's (cached), stopping at the APK stage.
      - if: matrix.image == 'otacon'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.otacon
          platforms: linux/arm64
          target: apk
          outputs: type=local,dest=apk
          cache-from: type=gha,scope=otacon

      - if: matrix.image == 'otacon'
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-apk
          path: apk/otacon-kiosk.apk
          if-no-files-found: error
