name: npm packages

# Checks the packages published to npm (@otacon-fleet/otacon-cli and
# @otacon-fleet/openclaw-otacon-voice), and that the repo's versions are in
# step (scripts/sync-versions.mjs). Publishing itself happens in release.yml.
on:
  pull_request:
    paths: ["src/cli/**", "src/openclaw-voice/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "**/package.json", "**/Cargo.toml", ".changeset/**", "scripts/*.mjs", ".github/workflows/packages.yml"]
  push:
    branches: [main]
    paths: ["src/cli/**", "src/openclaw-voice/**", "pnpm-lock.yaml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @otacon-fleet/otacon-cli --filter @otacon-fleet/openclaw-otacon-voice
      - name: CLI
        run: |
          pnpm --filter @otacon-fleet/otacon-cli run typecheck
          pnpm --filter @otacon-fleet/otacon-cli run build
          (cd src/cli && npm pack --dry-run)
      - name: OpenClaw plugin
        run: |
          pnpm --filter @otacon-fleet/openclaw-otacon-voice run test
          pnpm --filter @otacon-fleet/openclaw-otacon-voice run build
          (cd src/openclaw-voice && npm pack --dry-run)
      - name: Versions in step
        run: node scripts/sync-versions.mjs --check
